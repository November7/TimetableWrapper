<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html
    AcceptPathInfo On

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride All
        Require all granted
        Include /etc/apache2/timetable-php.conf
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # OAuth callback query parameters must not appear in access logs.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" timetable
    CustomLog ${APACHE_LOG_DIR}/access.log timetable
</VirtualHost>
