<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nowoczesny podglad planu lekcji bez ramek.">
  <title>Plan lekcji</title>
  <link rel="stylesheet" href="css/app.css" type="text/css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>Plan lekcji</h1>
        <label class="plan-select-wrap" for="plan-source-select">
          <span>Wersja planu</span>
          <select id="plan-source-select" aria-label="Wybierz wersje planu"></select>
        </label>
      </div>

      <label class="search-wrap" for="search-input">
        <span>Szukaj</span>
        <input id="search-input" type="search" placeholder="np. 1TA, SG, 41" autocomplete="off">
      </label>

      <div class="tabs" role="tablist" aria-label="Kategorie planow">
        <button class="tab active" data-category="oddzialy" role="tab" aria-selected="true">Oddzialy</button>
        <button class="tab" data-category="nauczyciele" role="tab" aria-selected="false">Nauczyciele</button>
        <button class="tab" data-category="sale" role="tab" aria-selected="false">Sale</button>
      </div>

      <ul id="item-list" class="item-list" aria-live="polite"></ul>
    </aside>

    <main class="content">
      <header class="content-header">
        <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>
        <div class="title-wrap">
          <h2 id="plan-title">Wczytywanie planu...</h2>
          <p id="plan-meta" class="meta">Trwa odczyt danych z plikow zrodlowych.</p>
        </div>
        <div class="header-actions">
          <div class="font-controls" role="group" aria-label="Rozmiar czcionki planu">
            <button id="font-decrease" class="font-toggle" type="button" aria-label="Zmniejsz czcionke planu" title="Zmniejsz czcionke">A-</button>
            <button id="font-increase" class="font-toggle" type="button" aria-label="Powieksz czcionke planu" title="Powieksz czcionke">A+</button>
          </div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Przelacz motyw" title="Przelacz motyw">
            <span id="theme-icon" aria-hidden="true">🌙</span>
          </button>
        </div>
      </header>

      <section id="schedule" class="schedule" aria-live="polite"></section>
      <div class="content-footer">
        <div id="label-controls" class="label-controls" aria-live="polite"></div>
        <footer id="generated-info" class="generated-info" aria-live="polite"></footer>
      </div>
    </main>
  </div>
